version: '3.7'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_api
    ports:
      - '3002:3000'
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: admin
      DB_NAME: ecommerce
  postgres:
   image: postgres:13
   container_name: postgres_db
   ports:
     - '5432:5432'
   environment:
     POSTGRES_DB: ecommerce
     POSTGRES_USER: admin
     POSTGRES_PASSWORD: admin
   volumes:
     - postgres_data:/var/lib/postgresql/data
volumes:
 postgres_data:
 